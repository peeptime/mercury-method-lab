name: Sync Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run sync:check
      - run: npm run validate
