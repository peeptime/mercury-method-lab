name: CI

on:
  push:
  pull_request:

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run doctor
      - run: npm run cycle:status
      - run: npm run cycle:check
      - run: npm run dashboard:check
      - run: npm run audit
      - run: npm run report
      - run: npm run audit:flow
      - run: npm run test
      - run: npm run validate
      - run: npm run index
